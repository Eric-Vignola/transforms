# Packaging for `transforms`.
#
# The repository root IS the package: `__init__.py`, `main.py` and `utils.py`
# sit at the top level and the modules import each other absolutely
# (`from transforms.main import ...`), so the directory must be installed
# UNDER the name `transforms`. That is what `package-dir` does below; without
# it setuptools' flat-layout discovery would install `main` and `utils` as
# top-level modules and every absolute import would fail.
#
# This file exists so `pip install git+https://github.com/Eric-Vignola/transforms`
# works. cgmath declares exactly that as a dependency, and a repository with no
# build metadata cannot be installed from a URL at all.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name            = "transforms"
version         = "1.0.0"
description     = "Vectorized matrix, quaternion, euler, axis-angle and vector math for CG, numpy-native and numba-accelerated."
readme          = "README.md"
requires-python = ">=3.9"
license         = { file = "LICENSE" }
authors         = [{ name = "Eric Vignola", email = "eric.vignola@gmail.com" }]
keywords        = ["math", "matrix", "quaternion", "euler", "vector", "transform", "cg", "vfx", "rigging", "numpy", "numba"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# Kept to what the modules actually import outside the test suite.
dependencies = [
    "numpy",
    "scipy",
    "numba",
]

[project.urls]
Homepage = "https://github.com/Eric-Vignola/transforms"
Source   = "https://github.com/Eric-Vignola/transforms"

[tool.setuptools]
# The root maps to the package name; every subpackage is then addressed
# relative to it. `_tests` is deliberately absent -- the fixtures are not
# part of the installed library.
package-dir = { "transforms" = "." }
packages    = [
    "transforms",
    "transforms._numba",
]
